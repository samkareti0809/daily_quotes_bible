name: Daily Bible Reflection

on:
  schedule:
    # Runs every day at 08:00 AM UTC. 
    # (Adjust the cron hour if you need to align with your local timezone offset)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows you to click 'Run workflow' manually to test it anytime!

jobs:
  send-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Bible bot script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bible_bot.py
